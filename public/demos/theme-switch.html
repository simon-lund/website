<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clip-path theme switcher — demo</title>
  <style>
    :root, [data-theme="light"] {
      --bg: #faf6f0; --surface: #fffdf9; --text: #1a1917; --muted: #6b6760;
      --border: #ece6dd; --accent: #c07f52; --accent-soft: #f6ece4;
    }
    [data-theme="dark"] {
      --bg: #1c1a17; --surface: #252320; --text: #e8e4de; --muted: #8a8580;
      --border: #34302a; --accent: #d4956a; --accent-soft: #352a22;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      /* fallback only — View Transitions does the real animation */
      transition: background-color .4s ease, color .4s ease;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: clamp(1.25rem, 5vw, 2.5rem); gap: 1.5rem;
    }
    header {
      width: 100%; max-width: 560px; display: flex;
      align-items: center; justify-content: space-between;
    }
    .label { display: inline-flex; align-items: center; gap: .45em; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .label svg { width: 1.05em; height: 1.05em; }
    .toggle {
      width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%;
      border: 1px solid var(--border); background: var(--surface); color: var(--text);
      cursor: pointer; transition: border-color .2s ease, transform .15s ease;
    }
    .toggle:hover { border-color: var(--accent); }
    .toggle:active { transform: scale(.93); }
    /* the icon rides above the ripple in its own snapshot, so it can spin */
    .icon { display: inline-flex; view-transition-name: toggle; }
    .icon svg { width: 20px; height: 20px; }

    main { width: 100%; max-width: 560px; }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      padding: clamp(1.25rem, 4vw, 2rem);
    }
    h1 { margin: 0 0 .5rem; font-size: clamp(1.4rem, 4vw, 1.9rem); letter-spacing: -.02em; line-height: 1.15; }
    p { margin: 0; color: var(--muted); line-height: 1.6; }
    .pill { display: inline-block; font-size: .72rem; font-weight: 600; letter-spacing: .04em;
      color: var(--accent); background: var(--accent-soft); padding: .25rem .6rem; border-radius: 999px; margin-bottom: .85rem; }

    /* View Transition: don't cross-fade — let the new theme be revealed by the clip-path */
    ::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
    ::view-transition-new(root) { z-index: 1; }
    ::view-transition-old(root) { z-index: 0; }

    /* the icon spins out / in on top of the wave */
    ::view-transition-group(toggle) { z-index: 2; }
    ::view-transition-old(toggle) { animation: icon-out .5s cubic-bezier(.4,0,.2,1) forwards; }
    ::view-transition-new(toggle) { animation: icon-in .5s cubic-bezier(.34,1.56,.64,1) forwards; }
    @keyframes icon-out { to { transform: rotate(150deg) scale(.3); opacity: 0; } }
    @keyframes icon-in { from { transform: rotate(-150deg) scale(.3); opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      ::view-transition-old(root), ::view-transition-new(root),
      ::view-transition-old(toggle), ::view-transition-new(toggle) { animation: none !important; }
    }
  </style>
</head>
<body>
  <header>
    <span class="label">Try it <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    <button id="toggle" class="toggle" aria-label="Toggle theme" title="Toggle theme">
      <span class="icon" id="icon"></span>
    </button>
  </header>
  <main>
    <div class="card">
      <span class="pill">clip-path</span>
      <h1>A theme that arrives like a wave.</h1>
      <p>Hit the toggle. The new theme doesn't snap or fade — a circle grows from the button and reveals it, with the button as the centre of the wave.</p>
    </div>
  </main>

  <script>
    // Lucide sun & moon (same icons as the site's toggle)
    const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>';
    const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>';

    const toggle = document.getElementById("toggle");
    const icon = document.getElementById("icon");
    const root = document.documentElement;
    const renderIcon = () => { icon.innerHTML = root.dataset.theme === "dark" ? SUN : MOON; };
    renderIcon();

    const swap = () => {
      root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
      renderIcon();
    };

    toggle.addEventListener("click", (e) => {
      const r = e.currentTarget.getBoundingClientRect();
      const x = r.left + r.width / 2, y = r.top + r.height / 2;
      const end = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
      const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

      if (!document.startViewTransition || reduce) { swap(); return; }

      const t = document.startViewTransition(swap);
      t.ready.then(() => {
        root.animate(
          { clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${end}px at ${x}px ${y}px)`] },
          { duration: 520, easing: "cubic-bezier(.4,0,.2,1)", pseudoElement: "::view-transition-new(root)" }
        );
      });
    });
  </script>
</body>
</html>
