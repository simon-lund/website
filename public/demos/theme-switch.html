<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clip-path theme switcher — demo</title>
  <style>
    :root, [data-theme="light"] {
      --bg: #faf6f0; --surface: #fffdf9; --text: #1a1917; --muted: #6b6760;
      --border: #ece6dd; --accent: #c07f52; --accent-soft: #f6ece4;
    }
    [data-theme="dark"] {
      --bg: #1c1a17; --surface: #252320; --text: #e8e4de; --muted: #8a8580;
      --border: #34302a; --accent: #d4956a; --accent-soft: #352a22;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      /* fallback only — View Transitions does the real animation */
      transition: background-color .4s ease, color .4s ease;
      display: flex; flex-direction: column; align-items: center;
      padding: clamp(1.25rem, 5vw, 2.5rem); gap: 1.5rem;
    }
    header {
      width: 100%; max-width: 560px; display: flex;
      align-items: center; justify-content: space-between;
    }
    .label { font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .toggle {
      width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%;
      border: 1px solid var(--border); background: var(--surface); color: var(--text);
      cursor: pointer; transition: border-color .2s ease, transform .15s ease;
      view-transition-name: toggle;
    }
    .toggle:hover { border-color: var(--accent); }
    .toggle:active { transform: scale(.93); }
    .sun-moon { width: 20px; height: 20px; overflow: visible; transition: transform .6s cubic-bezier(.34,1.56,.64,1); }
    [data-theme="dark"] .sun-moon { transform: rotate(-130deg); }
    .sun-moon .disc { fill: currentColor; }
    .sun-moon .cut { fill: var(--surface); transform: translate(11px,-11px); transition: transform .6s cubic-bezier(.4,0,.2,1); }
    [data-theme="dark"] .sun-moon .cut { transform: translate(4px,-3px); }
    .sun-moon .rays { stroke: currentColor; stroke-width: 2; stroke-linecap: round; transform-box: fill-box; transform-origin: center; transition: transform .5s cubic-bezier(.4,0,.2,1), opacity .35s ease; }
    [data-theme="dark"] .sun-moon .rays { transform: scale(.35); opacity: 0; }
    main { width: 100%; max-width: 560px; }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      padding: clamp(1.25rem, 4vw, 2rem);
    }
    h1 { margin: 0 0 .5rem; font-size: clamp(1.4rem, 4vw, 1.9rem); letter-spacing: -.02em; line-height: 1.15; }
    p { margin: 0; color: var(--muted); line-height: 1.6; }
    .pill { display: inline-block; font-size: .72rem; font-weight: 600; letter-spacing: .04em;
      color: var(--accent); background: var(--accent-soft); padding: .25rem .6rem; border-radius: 999px; margin-bottom: .85rem; }

    /* View Transition: don't cross-fade — let the new theme be revealed by the clip-path */
    ::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
    ::view-transition-new(root) { z-index: 1; }
    ::view-transition-old(root) { z-index: 0; }
    ::view-transition-group(toggle) { z-index: 2; }

    @media (prefers-reduced-motion: reduce) {
      .sun-moon, .sun-moon * { transition: none !important; }
      ::view-transition-old(root), ::view-transition-new(root) { animation: none !important; }
    }
  </style>
</head>
<body>
  <header>
    <span class="label">Try it →</span>
    <button id="toggle" class="toggle" aria-label="Toggle theme" title="Toggle theme">
      <svg class="sun-moon" viewBox="0 0 24 24" aria-hidden="true">
        <circle class="disc" cx="12" cy="12" r="5" />
        <circle class="cut" cx="12" cy="12" r="5" />
        <g class="rays">
          <line x1="19.5" y1="12" x2="21.5" y2="12" /><line x1="17.3" y1="17.3" x2="18.72" y2="18.72" />
          <line x1="12" y1="19.5" x2="12" y2="21.5" /><line x1="6.7" y1="17.3" x2="5.28" y2="18.72" />
          <line x1="4.5" y1="12" x2="2.5" y2="12" /><line x1="6.7" y1="6.7" x2="5.28" y2="5.28" />
          <line x1="12" y1="4.5" x2="12" y2="2.5" /><line x1="17.3" y1="6.7" x2="18.72" y2="5.28" />
        </g>
      </svg>
    </button>
  </header>
  <main>
    <div class="card">
      <span class="pill">clip-path</span>
      <h1>A theme that arrives like a wave.</h1>
      <p>Hit the toggle. The new theme doesn't snap or fade — a circle grows from the button and reveals it, with the button as the centre of the wave.</p>
    </div>
  </main>

  <script>
    const toggle = document.getElementById("toggle");
    const root = document.documentElement;
    const swap = () => { root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark"; };

    toggle.addEventListener("click", (e) => {
      const r = e.currentTarget.getBoundingClientRect();
      const x = r.left + r.width / 2, y = r.top + r.height / 2;
      const end = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
      const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

      if (!document.startViewTransition || reduce) { swap(); return; }

      const t = document.startViewTransition(swap);
      t.ready.then(() => {
        root.animate(
          { clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${end}px at ${x}px ${y}px)`] },
          { duration: 520, easing: "cubic-bezier(.4,0,.2,1)", pseudoElement: "::view-transition-new(root)" }
        );
      });
    });
  </script>
</body>
</html>
